<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<meta name="author" content="Arsenii Kratsylo">
<title>Formularz - Kratsylo</title>
</head>
<body>
<h1>Formularz</h1>
<form action="#" method="get">
<label for="imie">Imię:</label><br>
<input type="text" id="imie" name="imie"><br><br>
<label for="email">Adres e-mail:</label><br>
<input type="email" id="email" name="email"><br><br>
<label for="temat">Temat:</label><br>
<select id="temat" name="temat">
<option>Informatyka</option>
<option>HTML</option>
<option>Inne</option>
</select><br><br>
<label for="wiadomosc">Wiadomość:</label><br>
<textarea id="wiadomosc" name="wiadomosc" rows="5" cols="35"></textarea><br><br>
<button type="submit">Wyślij</button>
</form>
<p><a href="index.html">Wróć do strony głównej</a></p>
</body>
</html>
